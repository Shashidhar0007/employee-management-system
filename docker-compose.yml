version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin"
        ]
      interval: 10s
      retries: 5

  backend:

    build: ./backend

    ports:
      - "5000:5000"

    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: employee_db

    depends_on:
      postgres:
        condition: service_healthy

  frontend:

    build: ./frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data: